[package]
name = "iqal-gtk"
description = "Iqal graphical app (GTK 4)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "iqal"
path = "src/main.rs"

[dependencies]
iqal-app = { path = "../iqal-app" }
iqal-core = { path = "../iqal-core" }
iqal-i18n = { path = "../iqal-i18n" }
iqal-ipc = { path = "../iqal-ipc" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
jiff.workspace = true
libshumate = "0.8.1"
serde.workspace = true
serde_json.workspace = true
