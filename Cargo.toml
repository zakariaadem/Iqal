[workspace]
resolver = "3"
members = ["crates/iqal-core", "crates/iqal-ipc", "crates/iqal-daemon", "crates/iqal-cli", "crates/iqal-agent", "crates/iqal-host", "crates/iqal-pack", "crates/iqal-i18n", "crates/iqal-gtk", "crates/iqal-app", "crates/iqal-win32", "crates/iqal-winres", "crates/iqal-setup"]

[workspace.package]
version = "0.1.12"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Iqal contributors"]

[workspace.dependencies]
aho-corasick = "1.1.5"
argon2 = "0.6.0"
getrandom = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
fluent-bundle = "0.16.0"
jiff = { version = "0.2.38", features = ["serde"] }
libc = "0.2.190"
nix = "0.31.3"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
unic-langid = "0.9.6"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
windows-service = "0.8"
windows-sys = "0.61"
x11rb = "0.14.0"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Argon2 is unbearably slow unoptimised; keep tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
